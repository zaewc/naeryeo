plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.naeryeo.liveupdate'
version = '0.1.0'

android {
  namespace "com.naeryeo.liveupdate"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // 1.17.0 is the first stable release with NotificationCompat.ProgressStyle and
  // Builder#setRequestPromotedOngoing (Android 16 Live Updates). 1.18.0+ requires compileSdk 36.1.
  implementation 'androidx.core:core-ktx:1.17.0'
  testImplementation 'junit:junit:4.13.2'
}
